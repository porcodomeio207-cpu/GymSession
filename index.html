<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>GymSession</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--panel2:#24272e;--muted:#9ca3af;--text:#f6f7f9;--accent:#ff8a00;--line:#343740;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;background:var(--panel2);color:var(--text);font-weight:650;cursor:pointer}button.primary{background:var(--accent);color:#171717}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{color:#ff7777}input,select{width:100%;background:#121317;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);min-width:0}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.wrap{max-width:760px;margin:auto;padding:20px 16px 26px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:900}.headline{font-size:30px;font-weight:850;letter-spacing:-.7px;margin:7px 0}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid #282a31;border-radius:18px;padding:15px;margin:12px 0}.stat{padding:14px;background:var(--panel);border-radius:15px}.stat strong{font-size:24px;display:block;margin-top:5px}.section-title{font-size:20px;font-weight:800;margin:24px 0 10px}.day{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:14px;background:var(--panel);border:1px solid #292b32;margin:9px 0}.day-icon{width:48px;height:48px;display:grid;place-items:center;background:#39260f;border-radius:14px;color:var(--accent);font-size:22px}.day .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}.day .arrow{margin-left:auto;color:var(--accent);font-size:22px}.nav{position:fixed;bottom:0;left:0;right:0;background:#17181d;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:var(--muted);font-size:11px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}.nav button span{font-size:20px}.nav button.active{color:var(--accent)}.hidden{display:none!important}.exercise{background:var(--panel);border-radius:17px;padding:14px;margin:12px 0;border:1px solid #2a2c32}.exercise-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.thumb{width:52px;height:52px;border-radius:12px;background:#332310;display:grid;place-items:center;color:var(--accent);overflow:hidden;font-size:23px;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover}.exercise-name{font-weight:800}.exercise-sub{font-size:12px;color:var(--muted);margin-top:4px}.set-head,.set-row{display:grid;grid-template-columns:32px minmax(65px,1fr) minmax(55px,.75fr) 42px;gap:7px;align-items:center}.set-head{font-size:11px;color:var(--muted);padding:0 2px 7px}.set-row{margin:7px 0}.set-row input{text-align:center;padding:10px 4px}.check{width:38px;height:38px;border-radius:10px;padding:0;background:#2b2d34;color:var(--muted)}.check.done{background:#17452f;color:var(--green)}.timer{display:flex;align-items:center;justify-content:space-between;gap:12px}.time{font-size:28px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--accent)}.timer-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.timer-controls button{padding:9px 12px}.field{margin:12px 0}.history-item{padding:13px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;color:var(--accent);background:#352512;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.chart{width:100%;height:220px;display:block}.photo-big{width:100%;max-height:260px;object-fit:cover;border-radius:14px}.foot{font-size:11px;line-height:1.5;color:var(--muted);margin-top:20px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#26352c;border:1px solid #376c4b;color:#d9ffe7;border-radius:12px;padding:12px 16px;z-index:20;max-width:90vw}
@media(min-width:600px){.wrap{padding-top:28px}.headline{font-size:36px}.day{max-width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav">
<button data-tab="home" class="active"><span>⌂</span>Hoje</button>
<button data-tab="exercises"><span>▦</span>Exercícios</button>
<button data-tab="history"><span>◷</span>Histórico</button>
<button data-tab="progress"><span>↗</span>Evolução</button>
</nav>
<script>
const KEY='gymsession-v1';
const workoutPlan={
 'Dia 1 — Push (Peito, Ombros, Tríceps)':[
 ['Incline Chest Press c/ barra','Peito',4,'8–10','90'],['Incline Chest Flyes c/ halteres','Peito',3,'8–12','90'],['Wide Push Up','Peito',3,'12','90'],['Chest Flyes c/ halteres','Peito',3,'12','60'],['Seated Shoulder Press c/ halteres','Ombros',3,'8–12','90'],['Frontal Raises c/ halteres','Ombros',4,'12–15','60'],['Tricep Kickback c/ haltere','Tríceps',3,'10–15','60'],['Trícep on couch or chair','Tríceps',3,'À falha','60']
 ],
 'Dia 2 — Pull (Costas, Bíceps, Posteriores de ombro)':[
 ['Mobilidade de ombros','Ombros',3,'12','40'],['Bent Over Row (Pronado)','Costas',4,'8–12','90'],['Dumbbell Row','Costas',3,'8–10','90'],['Reverse Flyes c/ halteres','Ombros',3,'12–15','60'],['Bicep Curl c/ barra','Bíceps',3,'8–12','60'],['Hammer Curl c/ halteres','Bíceps',3,'10–15','60']
 ],
 'Dia 3 — Pernas e Abdominais':[
 ['Caminhada na Passadeira','Cardio',1,'5 min','0'],['Air Squat','Pernas',3,'15','45'],['Front Squat c/ halteres','Pernas',4,'6–10','105'],['Stationary Lunges c/ halteres','Pernas',3,'10–12','90'],['Romanian Deadlift c/ halteres','Pernas',3,'12','90'],['Floor Calf Raises','Pernas',3,'8–12','90'],['Knee Touch Crunches','Abdominais',3,'15','30'],['Russian Twist','Abdominais',3,'12','30'],['Forearm Plank','Abdominais',3,'1 min','30']
 ],
 'Dia 4 — Upper':[
 ['Incline Chest Press c/ barra','Peito',3,'8–10','90'],['Close Grip Push Up','Tríceps',3,'12','60'],['Dumbbell Row','Costas',3,'10 cada braço','60'],['Shrugs c/ halteres','Ombros',3,'12','60'],['Incline Bicep Curl','Bíceps',3,'10–12','60'],['Single Arm Overhead Tricep Extension','Tríceps',3,'10–12','60']
 ],
 'Dia 5 — Full Body':[
 ['Sumo Squat c/ haltere','Pernas',3,'8–10','90'],['Stiff c/ halteres','Pernas',3,'12–15','60'],['Incline Chest Flyes c/ halteres','Peito',3,'10–12','90'],['Bent Over Row (Pronado)','Costas',3,'12','60'],['Bicep Curl c/ barra','Bíceps',3,'12','60'],['Trícep on couch or chair','Tríceps',3,'12','60'],['Sit ups','Abdominais',3,'15','30'],['Bicycle Crunch','Abdominais',3,'20','30'],['Forearm Plank','Abdominais',3,'40 s','30']
 ]
};
const templates=Object.fromEntries(Object.entries(workoutPlan).map(([day,items])=>[day,items.map(x=>x[0])]));
const initial=[...new Map(Object.values(workoutPlan).flat().map(x=>[x[0],[x[0],x[1],x[1]==='Pernas'?'Halteres':x[1]==='Abdominais'?'Peso corporal':'Halteres']])).values()];
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.exercises&&s.sessions)return s}catch(e){}return {exercises:initial.map(x=>({id:crypto.randomUUID(),name:x[0],group:x[1],equipment:x[2],photo:''})),sessions:[]}}
let db=load(),tab='home',current=null,timerSeconds=90,timerLeft=0,timerId=null,search='',filterExercise='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Armazenamento cheio. Tenta usar uma fotografia mais pequena.')}} 
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){return new Date(d).toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateTime(d){return new Date(d).toLocaleString('pt-PT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2400)}
function exByName(name){return db.exercises.find(e=>e.name===name)}
function iconFor(day){return day.includes('Push')?'🏋️':day.includes('Pull')?'💪':day.includes('Pernas')?'🦵':day.includes('Upper')?'💪':'⚡'}
function shell(content){document.getElementById('app').innerHTML=`<main class="wrap">${content}</main>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function home(){let count=db.sessions.length;let last=db.sessions[0];shell(`<div class="eyebrow">TREINA COM INTENÇÃO</div><div class="headline">GYMSESSION</div><p class="muted">O teu treino. Os teus números. A tua evolução.</p><div class="grid"><div class="stat"><span class="muted small">Sessões guardadas</span><strong>${count}</strong></div><div class="stat"><span class="muted small">Exercícios</span><strong>${db.exercises.length}</strong></div></div><div class="section-title">O teu plano de 5 dias</div>${Object.entries(templates).map(([day,names])=>`<button class="day" onclick="startWorkout('${day}')"><div class="day-icon">${iconFor(day)}</div><div><strong>${day}</strong><div class="sub">${names.length} exercícios</div></div><div class="arrow">›</div></button>`).join('')}<div class="card"><strong>Último treino</strong><p class="muted small">${last?`${esc(last.title)} · ${fmtDate(last.date)}`:'Ainda não guardaste nenhuma sessão.'}</p></div><p class="foot">Os dados ficam guardados no armazenamento local deste navegador. Não apagues os dados do Safari se quiseres manter o histórico.</p>`)}
function startWorkout(day){let items=workoutPlan[day]||[];current={id:crypto.randomUUID(),title:day,date:new Date().toISOString(),logs:items.map(([name,group,numSets,reps,rest])=>{let e=exByName(name);if(!e){e={id:crypto.randomUUID(),name,group,equipment:'Conforme o plano',photo:''};db.exercises.push(e)}let prev=[...db.sessions].reverse().flatMap(s=>s.logs).filter(l=>l.name===name).at(-1);let count=Number(numSets)||3;return {exerciseId:e.id,name,group,repsTarget:reps,restSeconds:Number(rest)||0,sets:Array.from({length:count},(_,i)=>({weight:prev?.sets?.[i]?.weight??0,reps:(parseInt(String(reps).replace(/[^0-9]/g,''),10)||10),done:false}))}})};timerSeconds=Number(items[0]?.[4])||90;save();renderWorkout()}
function renderWorkout(){if(!current)return;tab='workout';shell(`<div class="row between"><div><div class="eyebrow">SESSÃO EM CURSO</div><div class="headline">${esc(current.title)}</div><div class="muted small">${fmtDate(current.date)}</div></div><button class="ghost" onclick="cancelWorkout()">Fechar</button></div><div class="card"><div class="timer"><div><strong>Descanso</strong><div class="muted small">Marca uma série concluída para iniciar</div></div><div class="time" id="timerDisplay">${timeString(timerLeft)}</div></div><div class="timer-controls"><button onclick="adjustTimer(-15)">−15 s</button><button onclick="setRest()">Definir ${timerSeconds}s</button><button onclick="adjustTimer(15)">+15 s</button><button class="primary" onclick="toggleTimer()">${timerId?'Pausar':'Iniciar'}</button><button onclick="resetTimer()">Repor</button></div></div>${current.logs.map((l,i)=>`<section class="exercise"><div class="exercise-head"><div class="thumb">${exercisePhoto(l.exerciseId)}</div><div><div class="exercise-name">${esc(l.name)}</div><div class="exercise-sub">${esc(l.group||exByName(l.name)?.group||'Exercício')} · ${esc(l.repsTarget||'')} reps · descanso ${l.restSeconds??90}s</div></div></div><div class="set-head"><span>Série</span><span>Peso (kg)</span><span>Reps</span><span>Feita</span></div>${l.sets.map((s,j)=>`<div class="set-row"><span>${j+1}</span><input aria-label="Peso em kg" type="number" min="0" step="0.25" value="${s.weight}" onchange="editSet(${i},${j},'weight',this.value)"><input aria-label="Repetições" type="number" min="0" step="1" value="${s.reps}" onchange="editSet(${i},${j},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="ghost" style="margin-top:8px" onclick="addSet(${i})">＋ Adicionar série</button></section>`).join('')}<button class="primary" style="width:100%;padding:16px" onclick="finishWorkout()">Guardar sessão</button>`)}
function exercisePhoto(id){let e=db.exercises.find(x=>x.id===id);if(e?.photo)return `<img src="${e.photo}" alt="">`;let g=e?.group||'Corpo inteiro';let emoji=g==='Peito'?'🏋️':g==='Costas'?'💪':g==='Ombros'?'🙆':g==='Bíceps'?'💪':g==='Tríceps'?'🏋️':g==='Pernas'?'🦵':g==='Abdominais'?'🧘':g==='Cardio'?'🏃':'🏋️';return `<span aria-label="Ilustração de ${esc(g)}">${emoji}</span>`}
function editSet(i,j,k,v){current.logs[i].sets[j][k]=Number(v)||0}
function toggleSet(i,j){let s=current.logs[i].sets[j];s.done=!s.done;if(s.done){timerLeft=timerSeconds;startTimer()}renderWorkout()}
function addSet(i){let a=current.logs[i].sets,last=a[a.length-1]||{weight:0,reps:10};a.push({weight:last.weight,reps:last.reps,done:false});renderWorkout()}
function finishWorkout(){db.sessions.unshift(JSON.parse(JSON.stringify(current)));save();current=null;stopTimer();tab='history';render();toast('Sessão guardada neste iPhone.')}
function cancelWorkout(){if(confirm('Queres sair sem guardar esta sessão?')){current=null;stopTimer();tab='home';render()}}
function timeString(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function adjustTimer(n){timerSeconds=Math.max(15,Math.min(600,timerSeconds+n));if(timerLeft>0)timerLeft=timerSeconds;renderWorkout()}
function setRest(){let n=prompt('Tempo de descanso em segundos:',timerSeconds);if(n!==null&&Number(n)>0){timerSeconds=Math.min(600,Number(n));timerLeft=timerSeconds;renderWorkout()}}
function startTimer(){stopTimer();timerId=setInterval(()=>{if(timerLeft>0){timerLeft--;let el=document.getElementById('timerDisplay');if(el)el.textContent=timeString(timerLeft)}else{stopTimer();if(navigator.vibrate)navigator.vibrate([250,100,250]);toast('Descanso terminado!')}} ,1000);let b=document.querySelector('.timer-controls .primary');if(b)b.textContent='Pausar'}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function toggleTimer(){if(timerId){stopTimer();renderWorkout()}else{if(!timerLeft)timerLeft=timerSeconds;startTimer();renderWorkout()}}
function resetTimer(){stopTimer();timerLeft=0;renderWorkout()}
function exercises(){let items=db.exercises.filter(e=>(e.name+' '+e.group+' '+e.equipment).toLowerCase().includes(search.toLowerCase()));shell(`<div class="eyebrow">BIBLIOTECA</div><div class="headline">Exercícios</div><div class="row"><input placeholder="Pesquisar exercício..." value="${esc(search)}" oninput="search=this.value;exercises()" /><button class="primary" onclick="addExerciseForm()">＋</button></div>${items.map(e=>`<div class="exercise"><div class="row"><div class="thumb">${e.photo?`<img src="${e.photo}">`:'🏋️'}</div><div style="flex:1"><div class="exercise-name">${esc(e.name)}</div><div class="exercise-sub">${esc(e.group)} · ${esc(e.equipment)}</div></div><button class="ghost" onclick="editExercise('${e.id}')">Abrir</button></div></div>`).join('')||'<div class="empty">Não foram encontrados exercícios.</div>'}<p class="foot">Adiciona fotografias às fichas de exercício. As imagens são guardadas localmente.</p>`)}
function addExerciseForm(){shell(`<div class="headline">Novo exercício</div><div class="card"><div class="field"><label>Nome</label><input id="newName" placeholder="Ex.: Remada baixa"></div><div class="field"><label>Grupo muscular</label><select id="newGroup">${['Peito','Costas','Ombros','Bíceps','Tríceps','Pernas','Abdominais','Cardio','Corpo inteiro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Equipamento</label><input id="newEquip" placeholder="Ex.: Máquina" value="Halteres"></div><div class="row"><button onclick="exercises()">Cancelar</button><button class="primary" onclick="saveExercise()">Guardar exercício</button></div></div>`)}
function saveExercise(){let name=document.getElementById('newName').value.trim();if(!name){toast('Escreve o nome do exercício.');return}db.exercises.push({id:crypto.randomUUID(),name,group:document.getElementById('newGroup').value,equipment:document.getElementById('newEquip').value.trim()||'Não definido',photo:''});save();search='';tab='exercises';exercises();toast('Exercício adicionado.')}
function editExercise(id){let e=db.exercises.find(x=>x.id===id);if(!e)return;shell(`<button class="ghost" onclick="exercises()">‹ Voltar</button><div class="headline" style="margin-top:16px">${esc(e.name)}</div><div class="card"><div id="photoPreview">${e.photo?`<img class="photo-big" src="${e.photo}">`:'<div class="empty">Sem fotografia</div>'}</div><div class="field"><label>Fotografia do exercício</label><input id="photoInput" type="file" accept="image/*" onchange="savePhoto('${e.id}',this.files[0])"></div><p class="foot">Escolhe uma fotografia da biblioteca. Reduzimos a imagem para ajudar a poupar espaço.</p><div class="field"><label>Grupo muscular</label><input value="${esc(e.group)}" id="editGroup"></div><div class="field"><label>Equipamento</label><input value="${esc(e.equipment)}" id="editEquip"></div><button class="primary" style="width:100%" onclick="updateExercise('${e.id}')">Guardar alterações</button></div>`)}
function savePhoto(id,file){if(!file)return;let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,800/img.width,800/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let e=db.exercises.find(x=>x.id===id);e.photo=c.toDataURL('image/jpeg',.72);save();document.getElementById('photoPreview').innerHTML=`<img class="photo-big" src="${e.photo}">`;toast('Fotografia guardada.')} ;img.src=r.result};r.readAsDataURL(file)}
function updateExercise(id){let e=db.exercises.find(x=>x.id===id);e.group=document.getElementById('editGroup').value;e.equipment=document.getElementById('editEquip').value;save();exercises();toast('Ficha atualizada.')}
function history(){shell(`<div class="eyebrow">O TEU REGISTO</div><div class="headline">Histórico</div>${db.sessions.length?db.sessions.map(s=>`<div class="card"><div class="row between"><div><span class="pill">${esc(s.title)}</span><div style="font-weight:800;margin-top:9px">${fmtDateTime(s.date)}</div><div class="muted small" style="margin-top:5px">${s.logs.length} exercícios · ${s.logs.reduce((n,l)=>n+l.sets.filter(x=>x.done).length,0)} séries concluídas</div></div><button class="ghost danger" onclick="deleteSession('${s.id}')">Apagar</button></div><details style="margin-top:12px"><summary class="muted small">Ver séries e pesos</summary>${s.logs.map(l=>`<div class="history-item"><strong>${esc(l.name)}</strong><div class="muted small">${l.sets.map((x,i)=>`S${i+1}: ${x.weight} kg × ${x.reps}${x.done?' ✓':''}`).join(' · ')}</div></div>`).join('')}</details></div>`).join(''):'<div class="empty">Ainda não tens sessões guardadas.<br>Começa pelo treino Push, Pull ou Legs.</div>'}<button class="ghost" style="width:100%" onclick="exportData()">Exportar cópia de segurança (JSON)</button><div class="foot">Guarda o ficheiro exportado em Ficheiros para manter uma cópia dos teus dados.</div>`)}
function deleteSession(id){if(confirm('Apagar esta sessão do histórico?')){db.sessions=db.sessions.filter(s=>s.id!==id);save();history()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gymsession-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function progress(){let points=[];db.sessions.slice().reverse().forEach(s=>s.logs.forEach(l=>l.sets.forEach(set=>{if(set.weight>0)points.push({date:new Date(s.date),weight:set.weight,name:l.name})})));let names=[...new Set(points.map(p=>p.name))];shell(`<div class="eyebrow">DADOS, NÃO ADIVINHAS</div><div class="headline">Evolução</div>${points.length?`<div class="card"><div class="row between"><strong>Pesos registados</strong><select style="max-width:58%" id="chartFilter" onchange="filterExercise=this.value;progress()"><option value="all">Todos os exercícios</option>${names.map(n=>`<option ${filterExercise===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><canvas class="chart" id="chart" aria-label="Gráfico de evolução"></canvas><div class="muted small">O gráfico mostra o peso registado em cada série. Compara séries do mesmo exercício para avaliar a evolução.</div></div><div class="section-title">Últimos registos</div>${points.filter(p=>filterExercise==='all'||p.name===filterExercise).slice(-12).reverse().map(p=>`<div class="history-item row between"><div><strong>${esc(p.name)}</strong><div class="muted small">${fmtDate(p.date)}</div></div><strong>${p.weight} kg</strong></div>`).join('')}`:'<div class="empty">Ainda não há pesos para mostrar.<br>Regista um treino para começares a ver a tua evolução.</div>'}<div class="foot">Os gráficos são gerados a partir dos teus registos locais.</div>`);if(points.length)drawChart(points.filter(p=>filterExercise==='all'||p.name===filterExercise))}
function drawChart(points){let c=document.getElementById('chart');if(!c)return;let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=220*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let w=rect.width,h=220,pad=35;let vals=points.map(p=>p.weight),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min=Math.max(0,min-5);max=max+5}ctx.strokeStyle='#343740';ctx.fillStyle='#9ca3af';ctx.font='11px system-ui';for(let i=0;i<4;i++){let y=pad+(h-pad*1.4)*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-8,y);ctx.stroke();ctx.fillText((max-(max-min)*i/3).toFixed(1),2,y-4)}ctx.strokeStyle='#ff8a00';ctx.lineWidth=2.5;ctx.beginPath();points.forEach((p,i)=>{let x=pad+(w-pad-14)*(points.length===1?.5:i/(points.length-1)),y=pad+(h-pad*1.4)*(max-p.weight)/(max-min);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();points.forEach((p,i)=>{let x=pad+(w-pad-14)*(points.length===1?.5:i/(points.length-1)),y=pad+(h-pad*1.4)*(max-p.weight)/(max-min);ctx.fillStyle='#ff8a00';ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill()})}
function render(){if(current){renderWorkout();return}if(tab==='home')home();else if(tab==='exercises')exercises();else if(tab==='history')history();else progress()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(current&&!confirm('Sair do treino em curso? O treino não guardado será perdido.'))return;if(current){current=null;stopTimer()}tab=b.dataset.tab;render()}));
render();
</script>
</body></html>
